name: Weekly Lotto Data Update

on:
  schedule:
    # 매주 토요일 21:00 KST (12:00 UTC) - 추첨 후 약 1시간 뒤
    - cron: '0 12 * * 6'
  workflow_dispatch:  # 수동 실행도 가능

jobs:
  update-draws:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest draws
        run: python .github/scripts/update_draws.py

      - name: Commit and push updated draws.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add draws.json
          git diff --staged --quiet || git commit -m "data: 최신 당첨번호 자동 업데이트 $(date '+%Y-%m-%d')"
          git push
